<!doctype html>
<html lang="en" data-color-mode="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f7f5">
<meta name="description" content="Shop this store — browse products, add to cart and check out. No account needed.">
<title>Store</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<!-- Splash -->
<div class="splash" id="splash">
  <div class="inner">
    <img class="hide" id="splashLogo" alt="" onerror="this.classList.add('hide')">
    <strong id="splashName">Loading store…</strong>
    <div class="spinner" role="status" aria-label="Loading"></div>
  </div>
</div>

<div id="app">
  <div id="storeHeader">
    <!-- Site nav -->
    <header class="site-nav">
      <div class="wrap row between">
        <div class="brandmark">
          <img class="store-logo hide" id="storeLogo" alt="" onerror="this.classList.add('hide')">
          <div class="grow" style="min-width:0">
            <div class="truncate bold" id="storeName">Store</div>
            <div class="xs muted truncate" id="storeTagline"></div>
          </div>
        </div>
        <nav class="nav-links" aria-label="Primary">
          <a href="#home" class="nav-link on">Home</a>
          <a href="#shopSection" class="nav-link">Products</a>
        </nav>
        <div class="row" style="gap:8px">
          <button class="btn icon ghost" id="themeBtn" data-theme-toggle aria-label="Toggle dark mode">🌙</button>
          <button class="btn icon ghost" id="infoBtn" aria-label="Store information" title="Store info">ℹ️</button>
          <button class="btn icon ghost" id="trackBtn" aria-label="Check my order" title="Check my order">🔎</button>
        </div>
      </div>
    </header>

    <div class="announce hide" id="announce"></div>

    <!-- Hero -->
    <section class="hero" id="home">
      <div class="wrap hero-grid">
        <div class="hero-copy">
          <p class="hero-kicker hide" id="heroKicker"></p>
          <h1 class="hero-heading" id="heroHeading">Store</h1>
          <p class="hero-sub hide" id="heroSub"></p>
          <div class="hero-actions">
            <button class="btn primary lg" id="heroCta" type="button">Shop now</button>
          </div>
        </div>
        <div class="hero-media hide" id="heroMedia">
          <div class="gallery" id="heroGallery"></div>
          <div class="gal-dots" id="heroDots"></div>
        </div>
      </div>
    </section>
  </div>

  <main class="wrap" id="shopSection" style="padding-top:8px;padding-bottom:120px">
    <div class="searchbar">
      <span class="ico" aria-hidden="true">🔍</span>
      <input class="input" id="search" type="search" placeholder="Search products…" aria-label="Search products">
    </div>
    <div class="row between mt" style="gap:8px">
      <div class="chips grow" id="categories" role="tablist" aria-label="Categories"></div>
      <button class="btn icon ghost" id="viewToggle" aria-label="Toggle grid or list view">☰</button>
    </div>
    <div class="products mt-lg" id="products" data-view="grid"></div>
    <div id="emptyState"></div>
    <div id="sentinel" style="height:1px"></div>
    <div class="center mt-lg">
      <button class="btn ghost hide" id="loadMore">Load more</button>
    </div>
  </main>
</div>

<button class="fab" id="cartFab" hidden aria-label="Open cart">
  🛒 <span class="count" id="cartCount">0</span>
</button>

<script src="js/config.js"></script>
<script src="js/mock.js"></script>
<script src="js/ui.js"></script>
<script src="js/api.js"></script>
<script src="js/customer.js"></script>
<script>
  if ("serviceWorker" in navigator) {
    addEventListener("load", () => navigator.serviceWorker.register("service-worker.js").catch(() => {}));
  }
</script>
</body>
</html>
