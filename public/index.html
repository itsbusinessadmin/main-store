<!doctype html>
<html lang="en" data-color-mode="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f7f5">
<meta name="description" content="Shop this store — browse products, add to cart and check out. No account needed.">
<title>Store</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<!-- Splash -->
<div class="splash" id="splash">
  <div class="inner">
    <img class="hide" id="splashLogo" alt="" onerror="this.classList.add('hide')">
    <strong id="splashName">Loading store…</strong>
    <div class="spinner" role="status" aria-label="Loading"></div>
  </div>
</div>

<div id="app">
  <div id="storeHeader">
    <!-- Site nav -->
    <header class="site-nav">
      <div class="wrap row between">
        <div class="brandmark">
          <img class="store-logo hide" id="storeLogo" alt="" onerror="this.classList.add('hide')">
          <div class="grow" style="min-width:0">
            <div class="truncate bold" id="storeName">Store</div>
            <div class="xs muted truncate" id="storeTagline"></div>
          </div>
        </div>
        <nav class="nav-links" aria-label="Primary">
          <a href="#home" class="nav-link on">Home</a>
          <a href="#shopSection" class="nav-link">Products</a>
        </nav>
        <div class="row" style="gap:8px">
          <button class="btn icon ghost" id="themeBtn" data-theme-toggle aria-label="Switch to dark mode"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.6 14.1A8.9 8.9 0 1 1 10.4 3.3a6.9 6.9 0 0 0 10.2 10.8Z"/></svg></button>
          <button class="btn icon ghost" id="infoBtn" aria-label="Store information" title="Store info"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8.9"/><path d="M12 11.2v5"/><circle cx="12" cy="7.9" r="1.1" fill="currentColor" stroke="none"/></svg></button>
          <button class="btn icon ghost cart-btn" id="cartBtn" aria-label="Open cart" title="Cart"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.9 4h1.5a1.3 1.3 0 0 1 1.27 1.02L6.4 7.3"/><path d="M6.4 7.3H20.4l-1.55 6.2a1.7 1.7 0 0 1-1.65 1.3H9.6a1.7 1.7 0 0 1-1.65-1.3Z"/><circle cx="9.4" cy="19.4" r="1.55" fill="currentColor" stroke="none"/><circle cx="16.4" cy="19.4" r="1.55" fill="currentColor" stroke="none"/></svg><span class="count" id="cartCount" hidden>0</span></button>
        </div>
      </div>
    </header>

    <div class="announce hide" id="announce"></div>

    <!-- Hero -->
    <section class="hero" id="home">
      <div class="wrap hero-grid">
        <div class="hero-copy">
          <p class="hero-kicker hide" id="heroKicker"></p>
          <h1 class="hero-heading" id="heroHeading">Store</h1>
          <p class="hero-sub hide" id="heroSub"></p>
          <div class="hero-actions">
            <button class="btn primary lg" id="heroCta" type="button">Shop now</button>
          </div>
        </div>
        <div class="hero-media hide" id="heroMedia">
          <div class="gallery" id="heroGallery"></div>
          <div class="gal-dots" id="heroDots"></div>
        </div>
      </div>
    </section>
  </div>

  <main class="wrap" id="shopSection" style="padding-top:8px;padding-bottom:120px">
    <div class="searchbar">
      <span class="ico" aria-hidden="true"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="10.6" cy="10.6" r="6.8"/><path d="m15.55 15.55 5.05 5.05"/></svg></span>
      <input class="input" id="search" type="search" placeholder="Search products…" aria-label="Search products">
    </div>
    <div class="row between mt" style="gap:8px">
      <div class="chips grow" id="categories" role="group" aria-label="Filter by category"></div>
      <button class="btn icon ghost" id="viewToggle" aria-label="Switch to list view"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="4.1" cy="6.2" r="1.6" fill="currentColor" stroke="none"/><circle cx="4.1" cy="12" r="1.6" fill="currentColor" stroke="none"/><circle cx="4.1" cy="17.8" r="1.6" fill="currentColor" stroke="none"/><path d="M9.3 6.2h10.6M9.3 12h10.6M9.3 17.8h10.6" stroke-width="2.4"/></svg></button>
    </div>
    <div class="products mt-lg" id="products" data-view="grid"></div>
    <div id="emptyState"></div>
    <div id="sentinel" style="height:1px"></div>
    <div class="center mt-lg">
      <button class="btn ghost hide" id="loadMore">Load more</button>
    </div>
  </main>
</div>

<script src="js/config.js"></script>
<script src="js/icons.js"></script>
<script src="js/ui.js"></script>
<script src="js/api.js"></script>
<script src="js/customer.js"></script>
<script>
  if ("serviceWorker" in navigator) {
    addEventListener("load", () => navigator.serviceWorker.register("service-worker.js").catch(() => {}));
  }
</script>
</body>
</html>
