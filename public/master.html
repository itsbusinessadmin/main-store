<!doctype html>
<html lang="en" data-color-mode="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f2f2f7">
<meta name="robots" content="noindex,nofollow">
<title>Master Admin — Universal Store</title>
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/app.css">
<script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>

<div id="auth"></div>

<div class="shell hide" id="shell">
  <aside class="sidebar" id="sidebar"></aside>
  <header class="topbar">
    <div class="brandmark grow">
      <span class="truncate">Master Admin</span>
    </div>
    <span class="small muted truncate" id="ownerEmail"></span>
    <button class="btn icon ghost" data-theme-toggle onclick="UI.theme.toggle()" aria-label="Switch to dark mode"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.6 14.1A8.9 8.9 0 1 1 10.4 3.3a6.9 6.9 0 0 0 10.2 10.8Z"/></svg></button>
  </header>
  <main class="main" id="main"></main>
  <nav class="tabbar" id="tabbar" aria-label="Sections"></nav>
</div>

<script src="js/config.js" defer></script>
<script src="js/icons.js" defer></script>
<script src="js/ui.js" defer></script>
<script src="js/api.js" defer></script>
<script src="js/master.js" defer></script>
</body>
</html>
